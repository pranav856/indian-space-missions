<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Indian Space Missions</title>
    <link rel="stylesheet" href="styles.css">
</head>\
<body class="page-gallery">
    <canvas id="starfield"></canvas>

    <header>
        <h1>Indian Space Missions</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="missions.html">Missions</a>
            <a href="timeline.html">Timeline</a>
            <a href="scientists.html">Scientists</a>
            <a href="gallery.html" class="active">Gallery</a>
            <a href="about.html">About</a>
        </nav>
    </header>
    <main>
        <section>
            <h2>Image Gallery</h2>
            <div class="gallery-grid">
                <img src="https://upload.wikimedia.org/wikipedia/commons/1/1a/PSLV-C37_Launch.jpg" alt="PSLV Launch">
                <img src="https://upload.wikimedia.org/wikipedia/commons/3/3f/Chandrayaan2_carrying_GSLV_MkIII_M1_lift_off.jpg" alt="Chandrayaan-2 Launch">
                <img src="https://upload.wikimedia.org/wikipedia/commons/f/f4/Mangalyaan-Mars-Orbiter-Mission-India-ISRO-Spacecraft.jpg" alt="Mangalyaan Artist's Impression">
                <img src="https://upload.wikimedia.org/wikipedia/commons/9/9c/Aditya_L1_Spacecraft.jpg" alt="Aditya-L1 Spacecraft">
                <img src="https://upload.wikimedia.org/wikipedia/commons/9/93/Astrosat_Artistic_Impression.jpg" alt="Astrosat Artistic Impression">
                <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/ISRO_logo.svg" alt="ISRO Logo">
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 Indian Space Missions. Not affiliated with ISRO.</p>
    </footer>
<script>
const canvas = document.getElementById('starfield');
const ctx = canvas.getContext('2d');
let stars = [];
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
function initStars() {
    stars = [];
    const count = Math.floor((canvas.width * canvas.height) / 3500);
    for (let i = 0; i < count; i++) {
        stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            r: Math.random() * 1.3 + 0.2,
            alpha: Math.random() * 0.7 + 0.2,
            twinkleSpeed: Math.random() * 0.018 + 0.004,
            twinkleDir: Math.random() > 0.5 ? 1 : -1,
            color: Math.random() > 0.85 ? 'rgba(255,200,120,' :
                   Math.random() > 0.7  ? 'rgba(180,200,255,' : 'rgba(255,255,255,'
        });
    }
}
function drawStars() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const s of stars) {
        s.alpha += s.twinkleSpeed * s.twinkleDir;
        if (s.alpha > 0.9 || s.alpha < 0.1) s.twinkleDir *= -1;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `${s.color}${s.alpha.toFixed(2)})`;
        ctx.fill();
    }
    requestAnimationFrame(drawStars);
}
window.addEventListener('resize', () => { resize(); initStars(); });
resize(); initStars(); drawStars();
</script>
</body>
</html>
